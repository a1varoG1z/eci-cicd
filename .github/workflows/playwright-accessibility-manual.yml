name: test-playwright-accessibility-manual

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Navegador"
        required: true
        default: "chromium"
      headless:
        description: "Headless (true/false)"
        required: true
        default: "false"
      env:
        description: "Entorno"
        required: true
        default: "ci"

jobs:
  test-playwright-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Verificar inputs recibidos
        run: |
          echo "browser=${{ inputs.browser }}"
          echo "headless=${{ inputs.headless }}"
          echo "env=${{ inputs.env }}"

      - name: Ejecutar tests de accesibilidad
        run: |
          if [ "${{ inputs.headless }}" = "false" ]; then
            echo "Ejecutando en modo headed virtual con Xvfb"
            xvfb-run -a npx cross-env ENV=${{ inputs.env }} BROWSER=${{ inputs.browser }} HEADLESS=false cucumber-js --tags "@accesibility"
          else
            echo "Ejecutando en modo headless"
            npx cross-env ENV=${{ inputs.env }} BROWSER=${{ inputs.browser }} HEADLESS=true cucumber-js --tags "@accesibility"
          fi

      - name: Subir artefactos de reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports-${{ github.run_number }}
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json
            reports/screenshots
            reports/accessibility
            reports/lighthouse
          if-no-files-found: ignore
          retention-days: 7
